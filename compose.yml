services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - SERVER_PORT=55833
    healthcheck:
      test: ["CMD", "netstat", "-an", "|", "grep", "55833"]
      interval: 5s
      timeout: 10s
      retries: 5

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    environment:
      - SERVER_PORT=55833
      - SERVER_NAME=server